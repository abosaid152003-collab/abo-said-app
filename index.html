<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abo Said App</title>

    <!-- إعدادات أيقونة التطبيق والـ PWA لشاشة الموبايل وكرووم -->
    <link rel="icon" type="image/jpeg" href="ahmed logo.jpg">
    <link rel="apple-touch-icon" href="ahmed logo.jpg">
    <meta name="theme-color" content="#075e54">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abo Said App">

    <!-- Web App Manifest مدمج مباشرة لدعم متصفح كرووم -->
    <link rel="manifest" href='data:application/manifest+json,{
        "name": "Abo Said App",
        "short_name": "Abo Said",
        "start_url": "./index.html",
        "display": "standalone",
        "background_color": "#075e54",
        "theme_color": "#075e54",
        "icons": [
            {
                "src": "ahmed logo.jpg",
                "sizes": "192x192",
                "type": "image/jpeg"
            },
            {
                "src": "ahmed logo.jpg",
                "sizes": "512x512",
                "type": "image/jpeg"
            }
        ]
    }'>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App (v8) & Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* خلفية الواتساب الشهيرة */
        .whatsapp-bg {
            background-color: #efeae2;
            background-image: radial-gradient(#cbd5e1 1px, transparent 0);
            background-size: 16px 16px;
        }
        /* فقاعة رسالة واتساب */
        .chat-bubble-me {
            background-color: #d9fdd3;
            border-radius: 12px 0px 12px 12px;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="app-container shadow-2xl relative pb-20">

        <!-- Lock Screen -->
        <div id="lockScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-white max-w-[480px] mx-auto">
            <div class="w-28 h-28 rounded-full overflow-hidden mb-6 shadow-2xl border-4 border-emerald-500 flex items-center justify-center bg-slate-800">
                <img src="./ahmed logo.jpg" alt="Ahmed Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold mb-2">Abo Said App</h1>
            <p class="text-gray-400 text-sm mb-8 text-center">مرحباً بك يا أحمد، يرجى إدخال كلمة المرور</p>
            
            <div class="w-full max-w-xs space-y-4">
                <input type="password" id="passwordInput" placeholder="كلمة المرور" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-center text-lg focus:outline-none focus:border-emerald-500 transition">
                <button onclick="checkPassword()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg transition active:scale-95">
                    دخول
                </button>
                <p id="loginError" class="text-red-400 text-xs text-center hidden">كلمة المرور غير صحيحة!</p>
            </div>
        </div>

        <!-- Header -->
        <header class="bg-[#075e54] text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/40 flex items-center justify-center bg-emerald-800">
                    <img src="./ahmed logo.jpg" alt="Ahmed Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Abo Said App</h1>
                    <span id="syncStatus" class="text-xs text-emerald-200 flex items-center gap-1">
                        <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> متصل بـ Firebase
                    </span>
                </div>
            </div>
            <button onclick="lockApp()" class="text-emerald-200 hover:text-white p-2 text-sm flex items-center gap-1">
                <i class="fa-solid fa-right-from-bracket"></i> قفل
            </button>
        </header>

        <!-- Main Content Area -->
        <main class
