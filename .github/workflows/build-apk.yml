name: Build Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean & Prepare Web Directory
        run: |
          rm -rf android www package*.json capacitor.config.*
          mkdir -p www resources
          cp -r index.html manifest.json my-logo.png www/ 2>/dev/null || true
          cp my-logo.png resources/icon.png 2>/dev/null || true
          cp my-logo.png resources/splash.png 2>/dev/null || true

      - name: Install Capacitor & Res Tool
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm install -g cordova-res

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Abo Said" "com.abosaid.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate App Icon & Splash
        run: |
          cordova-res android --skip-config --copy

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abo-Said-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
