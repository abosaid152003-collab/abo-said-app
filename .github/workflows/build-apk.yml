name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean & Prepare Web Directory
        run: |
          rm -rf android www package*.json capacitor.config.* assets
          mkdir -p www assets
          
          # منع الكاش
          VERSION=$(date +%s)
          sed -i "s/index.html/index.html?v=$VERSION/g" manifest.json || true

          # نسخ ملفات الـ Web
          cp -f index.html www/
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f "ahmed logo.png" www/ 2>/dev/null || true

          # الأيقونات
          cp -f "ahmed logo.png" assets/icon-only.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/icon-foreground.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/icon-background.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/splash.png 2>/dev/null || true

      - name: Install Capacitor & Assets Tool
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm install -g @capacitor/assets

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Abo Said" "com.abosaid.app" --web-dir www
          npx cap add android

      # إضافة ودجة أندرويد الأصلية وتجهيزها لتظهر في قائمة الـ Widgets بالموبايل
      - name: Inject Android Native App Widget
        run: |
          # 1. إنشاء مجلدات الموارد للودجة
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/java/com/abosaid/app

          # 2. تصميم شكل الودجة (خلفية زجاجية أنيقة)
          cat << 'EOF' > android/app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E60F172A" />
              <corners android:radius="16dp" />
              <stroke android:width="1dp" android:color="#38BDF8" />
          </shape>
          EOF

          # 3. تصميم واجهة الودجة (XML Layout)
          cat << 'EOF' > android/app/src/main/res/layout/prayer_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_container"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@drawable/widget_bg"
              android:padding="12dp"
              android:gravity="center">

              <TextView
                  android:id="@+id/widget_title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🕌 مواقيت صلاة أوفا"
                  android:textColor="#38BDF8"
                  android:textStyle="bold"
                  android:textSize="13sp" />

              <TextView
                  android:id="@+id/widget_timer"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="اضغط لفتح التطبيق"
                  android:textColor="#FACC15"
                  android:textStyle="bold"
                  android:textSize="15sp"
                  android:layout_marginTop="4dp" />
          </LinearLayout>
          EOF

          # 4. إعدادات الودجة للنظام (App Widget Provider Info)
          cat << 'EOF' > android/app/src/main/res/xml/prayer_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="70dp"
              android:updatePeriodMillis="86400000"
              android:initialLayout="@layout/prayer_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          EOF

          # 5. كود الجافا لتشغيل الودجة وربطها بفتح التطبيق
          cat << 'EOF' > android/app/src/main/java/com/abosaid/app/PrayerWidget.java
          package com.abosaid.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          public class PrayerWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.prayer_widget);

                      Intent intent = new Intent(context, MainActivity.class);
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      views.setOnClickPendingIntent(R.id.widget_container, pendingIntent);

                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  }
              }
          }
          EOF

          # 6. تسجيل الودجة في AndroidManifest.xml بشكل صحيح تماماً
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()

          receiver_code = """
              <receiver android:name=".PrayerWidget" android:exported="true">
                  <intent-filter>
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  </intent-filter>
                  <meta-data android:name="android.appwidget.provider" android:resource="@xml/prayer_widget_info" />
              </receiver>
          </application>
          """

          content = content.replace("</application>", receiver_code)

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          '

          npx cap sync android

      - name: Generate App Icon & Splash
        run: |
          npx capacitor-assets generate --android || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abo-Said-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
