name: Build Abo Said Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد Java JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. إعداد بيئة بناء Android
      - name: Setup Android SDK
        uses: actions/setup-android@v3

      # 5. تثبيت أداة Cordova لبناء ملف الـ APK بدون تعقيدات
      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create cordova_app com.abosaid.app "Abo Said App"
          cd cordova_app
          rm -rf www/*
          cp -r ../* www/ || true
          cordova platform add android
          cordova build android --debug

      # 6. رفع ملف الـ APK المكتمل لتنزيله فوراً
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AboSaidApp-v25-APK
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
