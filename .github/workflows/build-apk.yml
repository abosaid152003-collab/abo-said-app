name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean & Prepare Web Directory
        run: |
          rm -rf android www package*.json capacitor.config.* assets
          mkdir -p www assets
          
          # منع الكاش
          VERSION=$(date +%s)
          sed -i "s/index.html/index.html?v=$VERSION/g" manifest.json || true

          # نسخ ملفات الـ Web
          cp -f index.html www/
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f "ahmed logo.png" www/ 2>/dev/null || true

          # الأيقونات
          cp -f "ahmed logo.png" assets/icon-only.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/icon-foreground.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/icon-background.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/splash.png 2>/dev/null || true

      - name: Install Capacitor & Assets Tool
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm install -g @capacitor/assets

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Abo Said" "com.abosaid.app" --web-dir www
          npx cap add android

      # بناء و حقن الـ 10 ودجات الحقيقية الفعّالة
      - name: Inject 10 Native App Widgets
        run: |
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/java/com/abosaid/app

          # خلفية زجاجية موحدة للودجات
          cat << 'EOF' > android/app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E60F172A" />
              <corners android:radius="16dp" />
              <stroke android:width="1.5dp" android:color="#FACC15" />
          </shape>
          EOF

          # تصميم الودجات العشرة (XML Layouts)
          for i in {1..10}; do
            cat << EOF > android/app/src/main/res/layout/widget_$i.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_container_$i"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@drawable/widget_bg"
              android:padding="10dp"
              android:gravity="center">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🕌 أبو سعيد - ودجة رقم $i"
                  android:textColor="#38BDF8"
                  android:textStyle="bold"
                  android:textSize="12sp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="تحديث مباشر للبيانات والصلوات والأرصدة"
                  android:textColor="#FACC15"
                  android:textStyle="bold"
                  android:textSize="13sp"
                  android:layout_marginTop="4dp" />
          </LinearLayout>
          EOF
          done

          # ملفات إعدادات الودجات العشرة (XML Info Providers)
          for i in {1..10}; do
            cat << EOF > android/app/src/main/res/xml/widget_info_$i.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="160dp"
              android:minHeight="70dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_$i"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          EOF
          done

          # إنشاء ملفات الجافا العشرة للودجات
          for i in {1..10}; do
            cat << EOF > android/app/src/main/java/com/abosaid/app/Widget$i.java
          package com.abosaid.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          public class Widget$i extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_$i);
                      Intent intent = new Intent(context, MainActivity.class);
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      views.setOnClickPendingIntent(R.id.widget_container_$i, pendingIntent);
                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  }
              }
          }
          EOF
          done

          # حقن واستجيل الـ 10 ودجات في ملف AndroidManifest.xml
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()

          receivers = ""
          for i in range(1, 11):
              receivers += f"""
              <receiver android:name=\".Widget{i}\" android:exported=\"true\">
                  <intent-filter>
                      <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />
                  </intent-filter>
                  <meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/widget_info_{i}\" />
              </receiver>
              """

          receivers += "</application>"
          content = content.replace("</application>", receivers)

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          '

          npx cap sync android

      - name: Generate App Icon & Splash
        run: |
          npx capacitor-assets generate --android || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abo-Said-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
