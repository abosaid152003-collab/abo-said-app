name: Build Abo Said Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # للسماح بتشغيل البناء يدوياً من خيار Actions في GitHub

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود المحدث من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-style: '18'

      # 3. إعداد بيئة Java / JDK المطلوبة لبناء أندرويد
      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. إعداد بيئة Android SDK
      - name: Setup Android SDK
        uses: actions/setup-android@v3

      # 5. تحديث رقم النسخة في الملفات لمنع الكاش (Cache Busting)
      - name: Inject Dynamic Versioning
        run: |
          VERSION=$(date +%s)
          sed -i "s/app_data_v25/app_data_v25?v=$VERSION/g" index.html || true

      # 6. تثبيت المكتبات وتجهيز تطبيق الأندرويد باستخدام Capacitor
      - name: Install Dependencies and Build Web Assets
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Abo Said App" "com.abosaid.app" --web-dir .
          npx cap add android || true
          npx cap sync android

      # 7. بناء ملف الـ APK النهائي عبر Gradle
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. رفع ملف الـ APK الجاهز كـ Artifact للتحميل المباشر من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AboSaidApp-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
