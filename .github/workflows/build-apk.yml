name: Build Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r index.html manifest.json ahmed\ logo.png www/ 2>/dev/null || true

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Abo Said" "com.abosaid.app" --web-dir www
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abo-Said-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
