name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean & Prepare Web Directory
        run: |
          rm -rf android www package*.json capacitor.config.* assets
          mkdir -p www assets
          
          # إجبار التحديث لمنع الكاش على التليفون
          VERSION=$(date +%s)
          sed -i "s/index.html/index.html?v=$VERSION/g" manifest.json || true

          # نسخ ملف HTML الأساسي بشكل مباشر وصريح
          cp -f index.html www/
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f "ahmed logo.png" www/ 2>/dev/null || true

          # تجهيز الأيقونات
          cp -f "ahmed logo.png" assets/icon-only.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/icon-foreground.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/icon-background.png 2>/dev/null || true
          cp -f "ahmed logo.png" assets/splash.png 2>/dev/null || true

      - name: Install Capacitor & Assets Tool
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm install -g @capacitor/assets

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Abo Said" "com.abosaid.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate App Icon & Splash
        run: |
          npx capacitor-assets generate --android || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abo-Said-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
